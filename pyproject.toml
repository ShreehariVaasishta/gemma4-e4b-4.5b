[project]
name = "gemma4-e4b-inference"
version = "0.1.0"
description = "From-scratch inference implementation for Gemma 4 E4B (4.5B effective parameters)"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "Apache-2.0"}

dependencies = [
    "torch>=2.5.0",
    "safetensors>=0.4.0",
    "tokenizers>=0.20.0",
    "huggingface-hub>=0.25.0",
    "numpy",
    "ninja>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "transformers>=4.50.0",    # only for comparison / validation
    "ruff",
]

[build-system]
requires = ["setuptools>=68.0", "wheel", "torch>=2.5.0", "ninja>=1.13.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gemma4*"]

[tool.ruff]
line-length = 120

# ── uv: install PyTorch from the CUDA 13.2 index ────────────────────
# This ensures PyTorch matches your system nvcc (CUDA 13.3).
# cu132 is the closest available build to system CUDA 13.3.
[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"

[tool.uv.sources]
torch = { index = "pytorch-cu132" }

